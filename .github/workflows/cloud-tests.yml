# local: real-provider integration tests (Cloudflare R2, AWS S3). Never triggered by pull requests
# (delivery kit invariant W4, which also excludes `push`): weekly and on demand, on main only, and its keys live in the `cloud-tests`
# environment, whose deployment branch policy is `main` only. Keys are scoped to one test bucket.
name: cloud-tests

on:
  schedule:
    - cron: "43 5 * * 2" # Tuesdays
  workflow_dispatch:

permissions: {}

concurrency:
  group: cloud-tests
  cancel-in-progress: false

jobs:
  cloud-tests:
    name: cloud-tests
    if: github.ref == 'refs/heads/main' && vars.CLOUD_TESTS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloud-tests # branch policy: main only
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # holds secrets: no cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm minio:up
      - run: pnpm test:integration
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
