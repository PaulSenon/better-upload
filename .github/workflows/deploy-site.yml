name: Deploy site

# Docs + shadcn registry on Cloudflare Workers via Alchemy.
#  - push to main  → stage `prod`
#  - pull request  → stage `pr-<number>` (preview URL), destroyed when the PR closes
# Disabled until the repository variable SITE_DEPLOY_ENABLED is "true" and the secrets exist:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ALCHEMY_PASSWORD, ALCHEMY_STATE_TOKEN.

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/**", "registry/**", ".github/workflows/deploy-site.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["apps/web/**", "packages/**", "registry/**"]

concurrency:
  group: deploy-site-${{ github.event.pull_request.number || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: vars.SITE_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'site-prod' || 'site-preview' }}
    env:
      STAGE: ${{ github.event_name == 'push' && 'prod' || format('pr-{0}', github.event.pull_request.number) }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Destroy preview
        if: github.event.action == 'closed'
        run: pnpm --filter @open-upload/web exec alchemy destroy --stage "$STAGE"
      - name: Deploy
        if: github.event.action != 'closed'
        run: pnpm --filter @open-upload/web run deploy -- --stage "$STAGE"
