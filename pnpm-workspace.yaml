packages:
  - packages/*
  - apps/*
  - tests/*
  - examples/*

catalog:
  typescript: 7.0.2
  vitest: 5.1.0
  tsdown: 0.23.7
  zod: 4.6.7
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^24.0.0
  "@playwright/test": 1.65.0
  vite: 8.3.8
  jose: 6.2.17

onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp

# Supply-chain safety: never install a version published less than 3 days ago.
minimumReleaseAge: 4320
